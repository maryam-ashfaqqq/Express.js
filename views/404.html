
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
</head>

<body style="
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background-color: #f5f7fb;
">

  <div style="
    text-align: center;
    background: white;
    padding: 50px 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    max-width: 500px;
    width: 90%;
  ">

    <h1 style="
      margin: 0;
      font-size: 100px;
      color: #2563eb;
      font-weight: bold;
    ">
      404
    </h1>

    <h2 style="
      margin: 15px 0;
      font-size: 30px;
      color: #1f2937;
    ">
      Page Not Found
    </h2>

    <p style="
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    ">
      Sorry, the page you are looking for doesn't exist or has been moved.
    </p>

    <a href="/" style="
      display: inline-block;
      padding: 12px 25px;
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    ">
      Go Back Home
    </a>

  </div>

</body>
</html>
